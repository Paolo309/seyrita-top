variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  # Enable colors in CI terminal
  TERM: ansi
  FORCE_COLOR: 1
  BINARY_DIR: ./sw/tests

default:
  before_script:
      # Install python virtual environment
    - source iis-env.sh
    - env

stages:
  - init
  - build
  - test

.base:
  artifacts:
    when: always
    expire_in: 1 week

init-deps:
  extends: .base
  stage: init
  script:
    # Check out the biggest bender dependencies serially
    # to avoid rate limiting issues
    - bender path cheshire
    - bender path cva6
    - bender path axi
    - bender path idma
    - bender path snitch_cluster
    - bender path memory_island
    # Collect bender sourcess
    - bender checkout
    # bender checkout sometimes fails,
  # due to rate limiting of github
  retry: 1


vsim-build:
  extends: .base
  stage: build
  script:
    # Checkout dependencies
    - bender checkout
    # Build hardware
    - make chs-hw-init
    - make sn-hw-all
    # Build Chimera SW
    - make chim-sw
    # Build Chimera Bootrom
    - make chim-bootrom-init
    # Compile SoC in vsim
    # XXX Somehow fails the first time due to missing zip in model_tmp
    - make chim-sim || echo "Retrying..."
    - make chs-hw-init
    - make chim-sim
  artifacts:
    paths: [ "hw", "sw", "target/sim" ]
    expire_in: 3 days

vivado-build:
  extends: .base
  stage: build
  timeout: 12h
  script:
    # Checkout dependencies
    - bender checkout
    # Build hardware
    - make chs-hw-init
    - make sn-hw-all
    # Build Chimera Bootrom
    - make chim-bootrom-init
    # Build Chimera bitstream for VCU128
    - make chim-xilinx-vcu128
    # Build Chimera SDK for ASIC backend
    - make chim-sdk HARDWARE_BACKEND=ASIC
  artifacts:
    paths: [ "target/xilinx/out", "sw/chimera-sdk/build-ASIC" ]
    expire_in: 3 days

vsim-test:
  extends: .base
  stage: test
  needs: [ vsim-build ]
  parallel:
    matrix:
      - TESTNAME:
          - testCluster
          - testClusterOffload
          - testMemBypass
          - testPeripheralsGating
          - testHyperbusAddr
          - testCfgBootAddr
  script:
    - make chim-run-batch BINARY=$BINARY_DIR/$TESTNAME.memisl.elf VSIM_FLAGS="-l $TESTNAME.transcript"
    - ./scripts/vsim_ret_error.sh $TESTNAME.transcript
  dependencies:
    - vsim-build
  artifacts:
    paths: [ "hw", "sw", "target/sim" ]
    exclude: [ "target/sim/vsim/work/**/*", "target/sim/vsim/work" ]
    expire_in: 4 weeks

setup-key:
  stage: init
  script:
    - mkdir -p $HOME/.ssh
    - echo "$BOARDBERG_MSC25H20_SSH_KEY" | base64 -d > $HOME/.ssh/id_ed25519
    - ssh-keyscan boardberg.ee.ethz.ch >> $HOME/.ssh/known_hosts 2>/dev/null
    - chmod 600 $HOME/.ssh/id_ed25519
  artifacts:
    name: "ssh-key"
    expire_in: 12 hours
    paths:
      - $HOME/.ssh

fpga-vcu128-test:
  stage: test
  needs: [vivado-build, setup-key]
  script:
    - make test-fpga
  artifacts:
    paths:
      - gdb_output.log
    expire_in: 4 weeks


