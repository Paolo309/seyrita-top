variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  # Enable colors in CI terminal
  TERM: ansi
  FORCE_COLOR: 1
  # Configure environment
  # TODO
  # Override pip cache directory
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# -------------------
# Define pipeline stages
# -------------------
# stages:
#   - setup
#   - build
#   - test

default:
  before_script:
    - source iis-env.sh
  cache: &global_cache
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
    policy: pull

