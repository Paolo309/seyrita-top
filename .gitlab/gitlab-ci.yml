############
# Build all #
############

build-all:
  # stage: build
  # needs: [setup]
  script:
    - bender checkout
    - make chim-all || echo "retrying..."
    - make chim-all

hello-world:
  # stage: test
  needs: [build-all]
  script:
    - echo "Hello world from seyrita-top CI!"